spring:
  application:
    name: auth-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  jwt:
    # 256-bit base64 / hex key for development. Can be overridden with JWT_SECRET env var.
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000     # 15 minutes (15 * 60 * 1000)
    refresh-token-expiration-ms: 604800000  # 7 days (7 * 24 * 60 * 60 * 1000)
    issuer: pranobkalitalabs.co.uk
  admin:
    default-email: admin@platform.com
    default-password: Admin@123456
    default-first-name: System
    default-last-name: Administrator
  services:
    address-service-url: ${ADDRESS_SERVICE_URL:http://localhost:8082}
    timeout-ms: 3000
  rate-limiting:
    enabled: true
    login-per-minute: 10
    register-per-minute: 5
    forgot-password-per-minute: 3
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://pranobkalitalabs.co.uk,https://*.pranobkalitalabs.co.uk}"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
