name: CI/CD - Build, Test & Push Docker Image

# ==============================================================================
# Workflow: Continuous Integration & Continuous Delivery (CI/CD)
# Author:   Pranob Jyoti Kalita (Pranob Kalita Labs)
# Purpose:  1. Automatically runs unit & integration tests on pull requests & pushes.
#           2. Builds optimized multi-stage Docker images.
#           3. Pushes images to Docker Hub (pkalita/auth-service).
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Quality Gate
  # ----------------------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL database container for integration testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Check out the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 JDK with Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Execute Maven test suite against live PostgreSQL service
      - name: Execute Maven Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: authdb
          DB_USERNAME: postgres
          DB_PASSWORD: postgrespassword
          ADDRESS_SERVICE_URL: http://localhost:8082
        run: mvn clean test

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Docker Image to Docker Hub
  # ----------------------------------------------------------------------------
  docker-publish:
    name: Build & Publish to Docker Hub
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 JDK with Maven cache
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Publish Image directly to Docker Hub using Google Jib
      - name: Build & Publish to Docker Hub with Jib
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: mvn compile jib:build
